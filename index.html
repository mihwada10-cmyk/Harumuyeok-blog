<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하루무역 | 매일 한 편, 무역 공부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2F4; --surface:#FFFFFF; --ink:#14233A; --muted:#5A6B7E; --line:#C9D3DC;
  --steel:#2B5C8A; --red:#B23A30; --green:#2F6B4F; --yellow:#D99A1E; --teal:#1F7A86; --plum:#6A4A84; --slate:#4B5B6E; --rust:#9A5A2A;
  --plate:#14233A; --plate-ink:#F2F5F7;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A28; --surface:#16243A; --ink:#E6ECF2; --muted:#9AAABB; --line:#2B3D55;
    --plate:#E6ECF2; --plate-ink:#0F1A28;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A28; --surface:#16243A; --ink:#E6ECF2; --muted:#9AAABB; --line:#2B3D55;
  --plate:#E6ECF2; --plate-ink:#0F1A28;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
header.top .wrap{display:flex;align-items:center;gap:16px;height:60px}
.logo{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:24px;text-decoration:none;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.logo i{display:inline-flex;gap:2px}
.logo i b{width:6px;height:18px;border-radius:1px;display:block}
.top .grow{flex:1}
.search{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;width:min(240px,40vw)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}

/* hero: container door plate */
.hero{padding:40px 0 28px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:stretch}
.door{background:var(--steel);border-radius:6px;position:relative;padding:28px 28px 28px 52px;color:#fff;text-decoration:none;display:block;overflow:hidden;min-height:300px;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 14px,rgba(0,0,0,.08) 14px 28px)}
.door::before{content:"";position:absolute;left:16px;top:20px;bottom:20px;width:10px;border:2px solid rgba(255,255,255,.55);border-radius:3px}
.door .code{font-family:"Black Han Sans",sans-serif;font-size:clamp(34px,6vw,58px);line-height:1;letter-spacing:2px}
.door .code small{font-size:.45em;vertical-align:top;margin-left:8px;border:2px solid #fff;padding:2px 6px}
.door .meta{margin-top:10px;font-size:14px;opacity:.85}
.door h1{font-size:clamp(24px,3.4vw,34px);line-height:1.35;margin:26px 0 10px;font-weight:700;max-width:22ch}
.door p{margin:0;opacity:.92;max-width:44ch}
.door .open{display:inline-block;margin-top:20px;background:#fff;color:#14233A;font-weight:700;padding:8px 16px;border-radius:6px}
.side{display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}
.card h2{font-size:16px;margin:0 0 10px}
.term-word{font-size:22px;font-weight:700;margin:0}
.term-mean{color:var(--muted);margin:6px 0 0;font-size:15px;line-height:1.65}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:6px}
.cal span{aspect-ratio:1;border-radius:2px;background:var(--line);display:block}
.streak{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:10px}
.streak strong{color:var(--ink);font-size:18px}

/* categories */
.cats{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 20px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.chip .dot{width:9px;height:9px;border-radius:2px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.list{display:grid;gap:0;border-top:2px solid var(--ink);margin-bottom:60px}
.row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:20px;padding:20px 0;border-bottom:1px solid var(--line);text-decoration:none}
.row:hover h3{text-decoration:underline;text-underline-offset:4px}
.row .d{font-size:14px;color:var(--muted);line-height:1.4}
.row .d b{display:block;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:26px;color:var(--ink)}
.row h3{margin:4px 0 4px;font-size:20px;line-height:1.45}
.row p{margin:0;color:var(--muted);font-size:15px}
.tag{font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.tag .dot{width:9px;height:9px;border-radius:2px}
.empty{padding:40px 0;color:var(--muted)}

/* article */
article.post{max-width:720px;margin:0 auto;padding:36px 0 80px}
.back{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:15px;margin-bottom:20px}
article.post h1{font-size:clamp(26px,4vw,36px);line-height:1.35;margin:10px 0 12px}
.post .sub{color:var(--muted);font-size:15px;margin-bottom:28px;display:flex;gap:16px;flex-wrap:wrap}
.post .lead{font-size:19px;font-weight:500;border-left:4px solid var(--steel);padding-left:16px;margin:0 0 28px}
.body h2{font-size:22px;margin:36px 0 10px}
.body p{margin:0 0 18px}
.body ul,.body ol{padding-left:22px;margin:0 0 18px}
.body li{margin-bottom:6px}
.body strong{font-weight:700}
.body blockquote{margin:0 0 18px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.body .tw{overflow-x:auto;margin:0 0 18px}
.body table{border-collapse:collapse;min-width:100%;font-size:15px}
.body th,.body td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.body th{background:var(--surface)}
.termbox{margin-top:36px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--yellow);border-radius:8px;padding:18px 20px}
.termbox span{font-size:13px;color:var(--muted)}
.post .admin{display:flex;gap:8px;margin-top:28px}
.navpost{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px}
.navpost a{display:block;border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-decoration:none;font-size:15px;background:var(--surface)}
.navpost a span{display:block;font-size:13px;color:var(--muted)}

/* editor */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;width:min(760px,96vw);max-height:92vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,35,.55)}
.ed{padding:22px;display:grid;gap:12px}
.ed h2{margin:0;font-size:20px}
.ed label{font-size:14px;font-weight:600;display:grid;gap:4px}
.ed input,.ed select,.ed textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);width:100%}
.ed textarea{min-height:240px;line-height:1.6;font-size:15px}
.ed .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ed .hint{font-size:13px;color:var(--muted);margin:0}
.ed .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.ai{border:1px dashed var(--line);border-radius:8px;padding:12px;display:grid;gap:8px}
.ai .r{display:flex;gap:8px}
.ai .r input{flex:1}
.msg{font-size:14px;color:var(--red);margin:0;min-height:1em}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .row{grid-template-columns:72px minmax(0,1fr);gap:14px}
  .row .d b{font-size:20px}
  .ed .two{grid-template-columns:1fr}
  .search{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#/"><i aria-hidden="true"><b style="background:var(--steel)"></b><b style="background:var(--red)"></b><b style="background:var(--yellow)"></b></i>하루무역</a>
    <div class="grow"></div>
    <input class="search" id="q" type="search" placeholder="글 검색" aria-label="글 검색">
    <button class="btn ghost" id="exportBtn" hidden>글 데이터 내보내기</button>
    <button class="btn" id="writeBtn" hidden>새 글 쓰기</button>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer><div class="wrap">하루무역은 매일 한 편씩 무역 실무 지식을 정리합니다. 실제 거래 전에는 관세청, KOTRA, 거래 은행 등 공식 기관의 최신 기준을 꼭 확인하세요.</div></footer>

<dialog id="editor">
  <form class="ed" method="dialog" id="edForm">
    <h2 id="edTitle">새 글 쓰기</h2>
    <div class="two">
      <label>카테고리<select id="fCat"></select></label>
      <label>발행일<input id="fDate" type="date" required></label>
    </div>
    <label>제목<input id="fTitle" required maxlength="120"></label>
    <label>한 줄 요약<input id="fSummary" maxlength="200"></label>
    <label>본문
      <textarea id="fBody" required></textarea>
    </label>
    <p class="hint">## 소제목, - 목록, 1. 번호 목록, **굵게**, &gt; 인용, | 표 | 를 쓸 수 있어요.</p>
    <div class="two">
      <label>오늘의 용어<input id="fWord" placeholder="예: 선하증권 (B/L)"></label>
      <label>용어 뜻<input id="fMean"></label>
    </div>
    <p class="msg" id="edMsg"></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="edCancel">취소</button>
      <button type="button" class="btn" id="edSave">발행하기</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const CATS = [
  {name:"무역 기초", color:"var(--slate)"},
  {name:"인코텀즈", color:"var(--steel)"},
  {name:"통관·관세", color:"var(--red)"},
  {name:"무역결제", color:"var(--green)"},
  {name:"물류·운송", color:"var(--teal)"},
  {name:"FTA·원산지", color:"var(--yellow)"},
  {name:"무역영어", color:"var(--plum)"},
  {name:"시장 동향", color:"var(--rust)"}
];
const catColor = n => (CATS.find(c=>c.name===n)||CATS[0]).color;

let posts = [], db = null, canWrite = false, sample = null, filter = "", query = "", loaded = false, editingId = null;
const app = document.getElementById("app");

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")}
function md(src){
  const lines = String(src||"").replace(/\r/g,"").split("\n"); let out = [], i = 0;
  while(i<lines.length){
    const l = lines[i];
    if(!l.trim()){i++;continue}
    if(l.startsWith("## ")){out.push("<h2>"+inline(l.slice(3))+"</h2>");i++;continue}
    if(l.startsWith("> ")){let b=[];while(i<lines.length&&lines[i].startsWith("> ")){b.push(inline(lines[i].slice(2)));i++}out.push("<blockquote>"+b.join("<br>")+"</blockquote>");continue}
    if(/^\s*[-*] /.test(l)){let b=[];while(i<lines.length&&/^\s*[-*] /.test(lines[i])){b.push("<li>"+inline(lines[i].replace(/^\s*[-*] /,""))+"</li>");i++}out.push("<ul>"+b.join("")+"</ul>");continue}
    if(/^\s*\d+\. /.test(l)){let b=[];while(i<lines.length&&/^\s*\d+\. /.test(lines[i])){b.push("<li>"+inline(lines[i].replace(/^\s*\d+\. /,""))+"</li>");i++}out.push("<ol>"+b.join("")+"</ol>");continue}
    if(l.trim().startsWith("|")){
      let rows=[];while(i<lines.length&&lines[i].trim().startsWith("|")){rows.push(lines[i].trim());i++}
      rows = rows.filter(r=>!/^\|[\s:|-]+\|$/.test(r));
      const cells = r=>r.replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()));
      const [h,...rest]=rows;
      out.push('<div class="tw"><table><thead><tr>'+cells(h).map(c=>"<th>"+c+"</th>").join("")+"</tr></thead><tbody>"+rest.map(r=>"<tr>"+cells(r).map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>");
      continue;
    }
    let p=[];while(i<lines.length&&lines[i].trim()&&!/^(## |> |\s*[-*] |\s*\d+\. |\s*\|)/.test(lines[i])){p.push(inline(lines[i]));i++}
    out.push("<p>"+p.join("<br>")+"</p>");
  }
  return out.join("");
}
const fmtDate = d => {const [y,m,dd]=d.split("-");return `${y}년 ${+m}월 ${+dd}일`};
const todayStr = () => {const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
const readMin = b => Math.max(1,Math.round(String(b||"").length/500));
const sorted = () => [...posts].sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2200)}

function streakInfo(){
  const days = new Set(posts.map(p=>p.date));
  let streak=0; const d=new Date();
  if(!days.has(todayStr())) d.setDate(d.getDate()-1);
  while(true){const s=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(days.has(s)){streak++;d.setDate(d.getDate()-1)}else break}
  const cells=[]; const c=new Date(); c.setDate(c.getDate()-27);
  for(let k=0;k<28;k++){const s=c.getFullYear()+"-"+String(c.getMonth()+1).padStart(2,"0")+"-"+String(c.getDate()).padStart(2,"0");const p=posts.find(x=>x.date===s);cells.push({s,p});c.setDate(c.getDate()+1)}
  return {streak,cells};
}

function renderHome(){
  const all = sorted();
  if(!loaded){app.innerHTML='<p class="empty">글을 불러오는 중입니다.</p>';return}
  const latest = all[0];
  let hero = "";
  if(latest){
    const code = "TRDU "+latest.date.slice(2).replace(/-/g,"");
    const {streak,cells} = streakInfo();
    hero = `<section class="hero">
      <a class="door" href="#/post/${encodeURIComponent(latest.id)}" style="background-color:${catColor(latest.category)}">
        <div class="code">${code}<small>${esc(latest.category)}</small></div>
        <div class="meta">${latest.date===todayStr()?"오늘 입항한 글":"가장 최근 글"}, ${fmtDate(latest.date)}</div>
        <h1>${esc(latest.title)}</h1>
        <p>${esc(latest.summary)}</p>
        <span class="open">읽어 보기</span>
      </a>
      <div class="side">
        ${latest.term&&latest.term.word?`<div class="card"><h2>오늘의 무역 용어</h2><p class="term-word">${esc(latest.term.word)}</p><p class="term-mean">${esc(latest.term.meaning)}</p></div>`:""}
        <div class="card"><h2>최근 4주 발행 기록</h2>
          <div class="cal">${cells.map(x=>`<span title="${x.s}${x.p?" "+esc(x.p.title):""}" style="${x.p?"background:"+catColor(x.p.category):""}"></span>`).join("")}</div>
          <div class="streak"><span>연속 발행 <strong>${streak}일</strong></span><span>누적 <strong>${posts.length}편</strong></span></div>
        </div>
      </div>
    </section>`;
  } else {
    hero = `<section class="empty"><h1 style="color:var(--ink);font-size:28px;margin:30px 0 8px">첫 글을 기다리고 있어요</h1><p>${canWrite?"오른쪽 위 ‘새 글 쓰기’로 오늘의 무역 공부를 시작해 보세요.":"아직 발행된 글이 없습니다. 곧 첫 글이 올라옵니다."}</p></section>`;
  }
  const list = all.filter(p=>(!filter||p.category===filter)&&(!query||(p.title+p.summary+p.body+(p.term?.word||"")).toLowerCase().includes(query.toLowerCase())));
  app.innerHTML = hero + `
    <nav class="cats" aria-label="카테고리">
      <button class="chip" aria-pressed="${!filter}" data-cat="">전체</button>
      ${CATS.map(c=>`<button class="chip" aria-pressed="${filter===c.name}" data-cat="${c.name}"><span class="dot" style="background:${c.color}"></span>${c.name}</button>`).join("")}
    </nav>
    <section class="list">
      ${list.length?list.map(p=>`<a class="row" href="#/post/${encodeURIComponent(p.id)}">
        <div class="d"><b>${p.date.slice(5).replace("-",".")}</b>${p.date.slice(0,4)}</div>
        <div><span class="tag"><span class="dot" style="background:${catColor(p.category)}"></span>${esc(p.category)}</span>
        <h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p></div></a>`).join(""):`<p class="empty">${query?"‘"+esc(query)+"’에 맞는 글이 없어요. 다른 단어로 찾아보세요.":"이 카테고리에는 아직 글이 없어요."}</p>`}
    </section>`;
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.cat;renderHome()});
}

function renderPost(id){
  const all = sorted(); const idx = all.findIndex(p=>p.id===id); const p = all[idx];
  if(!loaded){app.innerHTML='<p class="empty">글을 불러오는 중입니다.</p>';return}
  if(!p){app.innerHTML='<p class="empty">글을 찾을 수 없어요. <a href="#/">목록으로 돌아가기</a></p>';return}
  const newer = all[idx-1], older = all[idx+1];
  app.innerHTML = `<article class="post">
    <button class="back" onclick="location.hash='#/'">← 전체 글</button>
    <span class="tag"><span class="dot" style="background:${catColor(p.category)}"></span>${esc(p.category)}</span>
    <h1>${esc(p.title)}</h1>
    <div class="sub"><span>${fmtDate(p.date)}</span><span>${readMin(p.body)}분 읽기</span></div>
    ${p.summary?`<p class="lead">${esc(p.summary)}</p>`:""}
    <div class="body">${md(p.body)}</div>
    ${p.term&&p.term.word?`<div class="termbox"><span>오늘의 용어</span><p class="term-word">${esc(p.term.word)}</p><p class="term-mean">${esc(p.term.meaning)}</p></div>`:""}
    ${canWrite?`<div class="admin"><button class="btn ghost small" id="editP">수정</button><button class="btn ghost small" id="delP">삭제</button></div>`:""}
    <nav class="navpost">
      ${older?`<a href="#/post/${encodeURIComponent(older.id)}"><span>이전 글</span>${esc(older.title)}</a>`:"<div></div>"}
      ${newer?`<a href="#/post/${encodeURIComponent(newer.id)}" style="text-align:right"><span>다음 글</span>${esc(newer.title)}</a>`:"<div></div>"}
    </nav>
  </article>`;
  if(canWrite){
    document.getElementById("editP").onclick=()=>openEditor(p);
    document.getElementById("delP").onclick=async()=>{
      if(!confirm("이 글을 삭제할까요? 되돌릴 수 없습니다.")) return;
      try{removePost(p.id);toast("삭제했어요");location.hash="#/"}catch(e){toast("삭제하지 못했어요: "+(e.message||e.code))}
    };
  }
  window.scrollTo(0,0);
}

function route(){
  const h = location.hash.replace(/^#/,"");
  const m = h.match(/^\/post\/(.+)$/);
  if(m) renderPost(decodeURIComponent(m[1])); else renderHome();
}
window.addEventListener("hashchange",route);
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim();if(location.hash.startsWith("#/post"))location.hash="#/";else renderHome()});

/* editor */
const dlg = document.getElementById("editor");
const $ = id => document.getElementById(id);
$("fCat").innerHTML = CATS.map(c=>`<option>${c.name}</option>`).join("");
function openEditor(p){
  editingId = p?p.id:null;
  $("edTitle").textContent = p?"글 수정":"새 글 쓰기";
  $("edSave").textContent = p?"수정 저장":"발행하기";
  $("fCat").value = p?.category||CATS[1].name;
  $("fDate").value = p?.date||todayStr();
  $("fTitle").value = p?.title||""; $("fSummary").value = p?.summary||""; $("fBody").value = p?.body||"";
  $("fWord").value = p?.term?.word||""; $("fMean").value = p?.term?.meaning||"";
  $("edMsg").textContent = "";
  dlg.showModal();
}
$("writeBtn").onclick=()=>openEditor(null);
$("edCancel").onclick=()=>dlg.close();
$("edSave").onclick=async()=>{
  const title=$("fTitle").value.trim(), body=$("fBody").value.trim(), date=$("fDate").value;
  if(!title||!body||!date){$("edMsg").textContent="제목, 본문, 발행일을 채워 주세요.";return}
  const data={title,body,date,category:$("fCat").value,summary:$("fSummary").value.trim(),term:{word:$("fWord").value.trim(),meaning:$("fMean").value.trim()}};
  $("edSave").disabled=true;
  try{
    if(editingId){const old=posts.find(x=>x.id===editingId);upsert(editingId,{...data,createdAt:old?.createdAt||Date.now()});toast("수정했어요")}
    else{const ref={id:"p"+Date.now()};upsert(ref.id,{...data,createdAt:Date.now()});toast("발행했어요");location.hash="#/post/"+encodeURIComponent(ref.id)}
    dlg.close();
  }catch(e){$("edMsg").textContent = "저장하지 못했어요. 브라우저 저장 공간을 확인하세요."}
  finally{$("edSave").disabled=false}
};

const STORE_KEY = "harumuyeok-posts";
canWrite = new URLSearchParams(location.search).get("admin") === "1";
function loadPosts(){
  let local = null;
  if(canWrite){ try{ local = JSON.parse(localStorage.getItem(STORE_KEY)||"null"); }catch(e){ local = null; } }
  posts = Array.isArray(local) ? local : POSTS.map(p=>({...p}));
  loaded = true;
}
function persist(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(posts)); }catch(e){ throw e; } route(); }
function upsert(id,data){ const i = posts.findIndex(p=>p.id===id); const doc = {id,...data}; if(i>=0) posts[i]=doc; else posts.push(doc); persist(); }
function removePost(id){ posts = posts.filter(p=>p.id!==id); persist(); }

$("writeBtn").hidden = !canWrite;
$("exportBtn").hidden = !canWrite;
$("exportBtn").onclick = async()=>{
  const text = "const POSTS = " + JSON.stringify(sorted(), null, 2) + ";";
  try{ await navigator.clipboard.writeText(text); toast("복사했어요. HTML 파일의 POSTS 부분에 붙여 넣으세요."); }
  catch(e){ const w = window.open("","_blank"); if(w){ w.document.body.innerHTML = "<pre style='white-space:pre-wrap'></pre>"; w.document.querySelector("pre").textContent = text; } }
};
loadPosts();
route();
